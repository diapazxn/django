{% extends 'pages/base.html' %}
{% block content %}
    <h2>Епоха: {{ current_year.year }}</h2>

    <h3>⭐ Ікони стилю (Натисніть для деталей):</h3>
    <div style="display: flex; flex-wrap: wrap; gap: 20px;">
    {% for icon in icons %}
        <div class="card" style="width: 250px;">
            {% if icon.photo %}
                <img src="{{ icon.photo.url }}" class="icon-photo" alt="{{ icon.name }}">
            {% endif %}
            <h4><a href="/icon/{{ icon.id }}/">{{ icon.name }}</a></h4>
        </div>
    {% empty %}
        <p>Ікон стилю для цього року поки немає.</p>
    {% endfor %}
    </div>
    <!-- ...тут залишається твій код виводу трендів... -->
{% endblock %}
